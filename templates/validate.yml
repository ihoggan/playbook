name: Validate

# ---------------------------------------------------------------------------
# TEMPLATE. Adjust the file names and commands; keep the SHAPE.
#
# The shape is: pin the COUNTS as environment variables and fail when they do
# not match. Exit codes alone are not enough -- a truncated source file whose
# remaining assertions all pass exits 0 and turns this workflow green. That is
# not hypothetical; it is how a stale file once survived every check on a real
# project for several revisions.
#
# Bumping these numbers is deliberate, happens in the same commit as the
# change, and gets mentioned in the commit message. THE UPKEEP IS THE GUARD.
#
# new-project.sh fills these in by RUNNING the scaffolded main.py, so this
# workflow is green on the FIRST push rather than the twentieth. If you are
# adopting an existing project, fill them in the same way -- run the thing,
# read the numbers off it, do not guess.
# ---------------------------------------------------------------------------
env:
  # The entry point. ADOPTING AN EXISTING PROJECT? Change this one line -- the
  # script you already have is not called main.py, and four hardcoded copies of
  # that name is four places to miss.
  ENTRY: main.py

  # How many assertions the selftest must report. Not "did it pass".
  SELFTEST_COUNT: 7

  # Hash of a deterministic generated output. This is the quiet hero: it
  # catches UNINTENDED change in output that no assertion describes. If you
  # are deliberately re-capturing the baseline, change this hash in the same
  # commit and say so in the message -- that is the whole point of it living
  # in version control rather than in someone's notes.
  BASELINE_MD5: "135e2fc4ac5bb293582e750fc7f1c0e0"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Two versions, so a deprecation is found here and not by a user.
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check syntax
      run: |
        # Check EVERY tracked script, including the ones nothing imports.
        # Helper scripts rot silently against a changing main module.
        python -m py_compile $(git ls-files '*.py')

    - name: Selftest — assertion COUNT, not just exit code
      run: |
        python $ENTRY --selftest | tee /tmp/selftest.log
        pass_n=$(grep -c '\[PASS\]' /tmp/selftest.log)
        fail_n=$(grep -c '\[FAIL\]' /tmp/selftest.log || true)
        echo "assertions: $pass_n passed, $fail_n failed (expected $SELFTEST_COUNT / 0)"
        test "$fail_n" -eq 0
        test "$pass_n" -eq "$SELFTEST_COUNT"

    - name: Smoke test — does it actually start
      run: python $ENTRY --smoke 90
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy

    - name: Baseline hash — unintended output change
      run: |
        python $ENTRY --snap /tmp/baseline.out
        got=$(md5sum /tmp/baseline.out | cut -d' ' -f1)
        echo "baseline: $got (expected $BASELINE_MD5)"
        test "$got" = "$BASELINE_MD5"
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy

    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: validation-${{ matrix.python-version }}
        path: |
          /tmp/selftest.log
          /tmp/baseline.out
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install pyflakes isort
    # BLOCKING, not advisory. No continue-on-error anywhere in this file:
    # a check that cannot fail the build is decoration.
    - run: python -m pyflakes $(git ls-files '*.py')
    - run: python -m isort --check-only --diff $(git ls-files '*.py')
